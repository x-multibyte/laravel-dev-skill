[program:reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/your-project/artisan reverb:start
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/your-project/storage/logs/reverb.log
stopwaitsecs=3600

# If multiple processes are needed (load balancing)
numprocs=1

# Environment variables
environment=APP_ENV="production",APP_DEBUG="false"

# Process priority (1-999, higher number means lower priority)
priority=5

# Startup delay (seconds)
startsecs=1

# Stop timeout (seconds)
stopasgroup=true
killasgroup=true